; Production PHP settings for the Docker image (not used by the local XAMPP).
; Copy to $PHP_INI_DIR/conf.d/ in the Dockerfile once one exists.
expose_php = Off
display_errors = Off
log_errors = On

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
